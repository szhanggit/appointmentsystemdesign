<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an account - Selah Head Spa</title>
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>

  <!-- Source: createaccount.png -->

  <div class="bc-auth-wrap">
    <div class="bc-auth-topbar px-0">
      <a href="10-signin.html" class="bc-auth-icon-btn"><i class="bi bi-arrow-left"></i></a>
      <a href="01-business-overview.html" class="bc-auth-icon-btn"><i class="bi bi-shop"></i></a>
    </div>

    <div class="bc-auth-icon"><i class="bi bi-chat-dots"></i></div>

    <!-- VERIFY: source screenshot literally reads "Create a account" (missing
         "n") - kept as-is per your request to replicate exact source text;
         please confirm whether this is a real typo in the product or a
         misread and correct it during your pass. -->
    <h1 class="h4 fw-bold text-center mb-1">Create a account</h1>
    <p class="text-muted text-center mb-4">Enter your details to create your account</p>

    <div class="mb-3">
      <label class="form-label">First name</label>
      <input type="text" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Last name</label>
      <input type="text" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control">
    </div>

    <label class="form-label">Phone number</label>
    <div class="row g-2 mb-3">
      <div class="col-auto">
        <select class="form-select">
          <option>CA +1</option>
        </select>
      </div>
      <div class="col">
        <input type="tel" class="form-control" placeholder="Phone number">
      </div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-8">
        <input type="text" class="form-control" placeholder="6 digit sms code">
      </div>
      <div class="col-4">
        <button class="btn btn-outline-secondary w-100">Get code</button>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label d-flex justify-content-between">
        Password
        <a href="#" class="bc-toggle-password" data-target="#passwordInput">Show</a>
      </label>
      <input type="password" class="form-control" id="passwordInput">
    </div>
    <div class="mb-4">
      <label class="form-label d-flex justify-content-between">
        Confirm New Password
        <a href="#" class="bc-toggle-password" data-target="#confirmPasswordInput">Show</a>
      </label>
      <input type="password" class="form-control" id="confirmPasswordInput">
    </div>

    <button class="btn btn-brand w-100 mb-3">Create account</button>
    <p class="text-center mb-0">Already have account? <a href="10-signin.html">Sign in</a></p>
  </div>

  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
