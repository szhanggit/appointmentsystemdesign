<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Selah Head Spa</title>
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>

  <!-- Source: signin.png -->

  <div class="bc-auth-wrap">
    <div class="bc-auth-topbar px-0">
      <a href="01-business-overview.html" class="bc-auth-icon-btn"><i class="bi bi-arrow-left"></i></a>
      <a href="01-business-overview.html" class="bc-auth-icon-btn"><i class="bi bi-shop"></i></a>
    </div>

    <div class="bc-auth-icon"><i class="bi bi-chat-dots"></i></div>

    <p class="text-center mb-4">New Here? <a href="11-create-account.html">Create an Account</a></p>

    <label class="form-label">Phone</label>
    <div class="row g-2 mb-3">
      <div class="col-auto">
        <select class="form-select">
          <option>CA +1</option>
        </select>
      </div>
      <div class="col">
        <input type="tel" class="form-control" placeholder="Phone number">
      </div>
    </div>

    <div class="row g-2 mb-2">
      <div class="col-8">
        <input type="text" class="form-control" placeholder="6 digit sms code">
      </div>
      <div class="col-4">
        <button class="btn btn-outline-secondary w-100">Get code</button>
      </div>
    </div>
    <p class="text-muted small mb-3">Please click "Get code" to continue</p>

    <a href="01-business-overview.html" class="btn btn-brand w-100 mb-3">Sign in</a>

    <div class="text-center text-muted small mb-3">OR</div>

    <button class="btn btn-outline-brand w-100 mb-2">Sign in with email</button>
    <button class="btn btn-outline-secondary w-100">
      <i class="bi bi-google"></i> Continue with Google
    </button>
  </div>

  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
