<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<body>
<!-- Source: shareGiftCard.png -->
<div class="phone-shell no-bottom-pad">
  <div class="sheet-header">
    <a href="26-choose-a-style.html"><i class="bi bi-arrow-left"></i></a>

  </div>
  <div class="sheet-step">Step 4 of 5</div>
  <div class="sheet-title">Share gift card</div>
  <div class="p-3">
    <div class="mb-3">
      <label class="form-label fw-semibold">Sender name</label>
      <input type="text" class="form-control">

    <div class="mb-3">
      <label class="form-label fw-semibold">Recipient name</label>

  <div class="cart-bar">
