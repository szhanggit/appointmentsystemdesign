<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review and confirm - Fresha</title>
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<!-- Source: reviewandconfirm.png (also reached identically as reviewandconfirm4.png) -->
<div class="phone-shell no-bottom-pad">
  <div class="sheet-header">
    <a href="30-review-continue.html"><i class="bi bi-arrow-left"></i></a>
    <a href="34-professional-services.html"><i class="bi bi-x-lg"></i></a>
  </div>
  <div class="p-3">
    <h1 class="fw-bold mb-3">Review and confirm</h1>

    <div class="fr-list-card mb-3">
      <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
        <div>
          <div class="fw-bold">Pay now in full</div>
          <div class="text-muted">Save time in store</div>
        </div>
        <i class="bi bi-record-circle-fill fs-4" style="color:var(--fr-purple);"></i>
      </div>
      <div class="d-flex justify-content-between align-items-center p-3">
        <div>
          <div class="fw-bold">Pay in store later</div>
          <div class="text-muted">No deposit is required</div>
        </div>
        <i class="bi bi-circle fs-4 text-muted"></i>
      </div>
    </div>

    <div class="fr-card mb-4">
      <div class="fw-bold mb-1">Cancellation policy</div>
      <div class="text-muted">Please cancel at least 24 hours before appointment.</div>
    </div>

    <h2 class="h6 fw-bold mb-2">Payment method</h2>
    <div class="mb-3">
      <label class="form-label fw-semibold">Name on card *</label>
      <input type="text" class="form-control" placeholder="Add card holder full name">
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Card number *</label>
      <div class="input-group">
        <input type="text" class="form-control" placeholder="Credit or debit card number">
        <span class="input-group-text bg-white"><i class="bi bi-credit-card"></i></span>
      </div>
    </div>
  </div>
  <div class="cart-bar">
    <div>
      <div class="cart-bar-price">from CA$11.30</div>
      <div class="cart-bar-meta">Pay now in full</div>
    </div>
    <!-- VERIFY: no explicit post-purchase confirmation screen was captured -->
    <a href="01-home.html" class="btn btn-fresha px-4">Add card</a>
  </div>
</div>
<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/site.js"></script>
</body>
</html>
