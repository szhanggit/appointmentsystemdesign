<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client sign in — Groway</title>
<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-teal-dark">
  <div class="container"><a class="navbar-brand font-display fs-4" href="index.html">Groway</a></div>
</nav>
<div class="container py-5" style="max-width:440px">
  <h2 class="font-display mb-1">Welcome back</h2>
  <p class="text-muted mb-4">Sign in to manage your bookings.</p>
  <div class="card"><div class="card-body p-4">
    <div class="mb-3"><label class="form-label">Email</label><input class="form-control" id="email" value="demo@groway.com"></div>
    <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" id="pw" value="growaydemo"></div>
    <div class="d-grid"><button class="btn btn-primary" id="go">Sign in</button></div>
    <div class="d-flex justify-content-between mt-3 small">
      <a href="client/register.html">Create account</a>
      <a href="client/forgot.html">Forgot password?</a>
    </div>
  </div></div>
  <p class="text-muted small mt-3 text-center">Demo login is prefilled — just press Sign in.</p>
</div>
<script src="assets/vendor/jquery.min.js"></script>
<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script>$("#go").on("click",()=>{location.href="client/bookings.html";});</script>
</body>
</html>
