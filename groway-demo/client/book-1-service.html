<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose services — Groway</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
<style>
.svc-card{cursor:pointer;border:2px solid #e9e2d2;border-radius:.6rem;transition:border-color .15s}
.svc-card:hover{border-color:var(--bs-primary)}
.svc-card.sel{border-color:var(--bs-primary);background:#f2f7f5}
.svc-card .seq-badge{background:var(--gold);color:#fff;border-radius:999px;font-size:.72rem;padding:.1rem .55rem}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-teal-dark">
  <div class="container">
    <a class="navbar-brand font-display fs-4" href="../index.html">Groway</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="map.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link" href="bookings.html">My bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="../login-client.html">Sign in</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4" style="max-width:760px">
  <div class="d-flex align-items-center gap-2 mb-1 flex-wrap" id="steps"></div>
  <h2 class="font-display mb-1">Choose services</h2>
  <p class="text-muted mb-1" id="storeline"></p>
  <p class="small text-muted mb-4">Pick up to 5 — one therapist performs your whole basket, back to back.</p>
  <div class="alert alert-warning d-none" id="maxerr">You can add up to 5 services per booking. Remove one to add another.</div>
  <div id="cats"></div>
  <div class="card mt-4 sticky-bottom" style="bottom:1rem"><div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div><span class="fw-semibold" id="bcount">0 selected</span><span class="text-muted small ms-2" id="btotal"></span></div>
    <button class="btn btn-primary" id="next" disabled>Continue</button>
  </div></div>
</div>
<script src="../assets/vendor/jquery.min.js"></script>
<script src="../assets/vendor/bootstrap.bundle.min.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script>
const BK={get(){try{return JSON.parse(sessionStorage.getItem('groway_booking')||'{}')}catch(e){return{}}},set(p){const b=Object.assign(this.get(),p);sessionStorage.setItem('groway_booking',JSON.stringify(b));return b}};
function renderSteps(n){const L=["Services","Therapist","Time","Details","Confirm"];$("#steps").html(L.map((l,i)=>`${i?'<span class="text-muted">—</span>':''}<span class="d-flex align-items-center gap-1"><span class="step-dot ${i<n?'done':i===n?'now':''}">${i<n?'✓':i+1}</span><span class="small ${i===n?'fw-bold':''}">${l}</span></span>`).join(""))}
function fmtDur(m){const h=Math.floor(m/60),r=m%60;return (h?h+"h ":"")+(r?r+"m":"").trim()||"0m"}
$(function(){
  renderSteps(0);
  const q=new URLSearchParams(location.search);
  const st0=BK.get();
  const storeId=q.get("store")||st0.storeId||"store-bayview";
  const s=DEMO.stores.find(x=>x.id===storeId)||DEMO.stores[0];
  $("#storeline").text(s.name+" · "+s.address);
  // carry ?src= attribution and preselected staff through the flow
  const patch={storeId:s.id};
  if(q.get("src")) patch.src=q.get("src");
  if(q.get("staff_id")) patch.staffId=q.get("staff_id");
  BK.set(patch);
  let sel=new Set(st0.serviceIds||[]);
  const pre=q.get("service_id");
  if(pre && DEMO.services.some(x=>x.id===pre)) sel.add(pre);
  const cats=[...new Set(DEMO.services.map(x=>x.cat))];
  cats.forEach(c=>{
    $("#cats").append(`<h6 class="mt-4 text-uppercase detail-label">${c}</h6><div class="row g-2" id="g-${c.replace(/\W+/g,'')}"></div>`);
    DEMO.services.filter(x=>x.cat===c).sort((a,b)=>a.seq-b.seq).forEach(sv=>{
      $(`#g-${c.replace(/\W+/g,'')}`).append(`<div class="col-md-6"><div class="svc-card p-3 h-100 ${sel.has(sv.id)?'sel':''}" data-id="${sv.id}">
        <div class="d-flex justify-content-between align-items-start mb-1">
          <span class="seq-badge">#${sv.seq} in sequence</span><span class="fw-bold">$${sv.price}</span></div>
        <div class="fw-semibold">${sv.name}</div>
        <div class="small text-muted">${sv.mins} mins</div></div></div>`);
    });
  });
  function refresh(){
    const list=[...sel].map(id=>DEMO.services.find(x=>x.id===id)).sort((a,b)=>a.seq-b.seq);
    const mins=list.reduce((t,x)=>t+x.mins,0), price=list.reduce((t,x)=>t+x.price,0);
    $("#bcount").text(`${list.length} selected`);
    $("#btotal").text(list.length?`${fmtDur(mins)} total · $${price}`:"");
    $("#next").prop("disabled",!list.length);
  }
  $("#cats").on("click",".svc-card",function(){
    const id=$(this).data("id");
    if(sel.has(id)){sel.delete(id);$(this).removeClass("sel");$("#maxerr").addClass("d-none");}
    else if(sel.size>=5){$("#maxerr").removeClass("d-none");return;}
    else{sel.add(id);$(this).addClass("sel");$("#maxerr").addClass("d-none");}
    refresh();
  });
  $("#next").on("click",()=>{
    const list=[...sel].map(id=>DEMO.services.find(x=>x.id===id)).sort((a,b)=>a.seq-b.seq);
    BK.set({serviceIds:list.map(x=>x.id)});
    location.href="book-2-staff.html";
  });
  refresh();
});
</script>
</body>
</html>
