<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reschedule — Groway</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-teal-dark">
  <div class="container">
    <a class="navbar-brand font-display fs-4" href="../index.html">Groway</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="map.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link active" href="bookings.html">My bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="../login-client.html">Sign in</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4" style="max-width:640px">
  <a href="#" id="back" class="small text-muted">&larr; Booking detail</a>
  <h2 class="font-display mt-2 mb-1">Reschedule</h2>
  <p class="text-muted mb-4">Currently: <strong id="cur"></strong></p>
  <h6 class="text-uppercase detail-label">New day</h6>
  <div class="d-flex gap-2 flex-wrap mb-4" id="days"></div>
  <h6 class="text-uppercase detail-label">New time</h6>
  <div class="row g-2" id="slots"></div>
  <div class="d-grid mt-4"><button class="btn btn-primary btn-lg" id="save" disabled>Confirm new time</button></div>
</div>
<script src="../assets/vendor/jquery.min.js"></script>
<script src="../assets/vendor/bootstrap.bundle.min.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script>
function fmtT(mins){let h=Math.floor(mins/60),m=mins%60;const ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${String(m).padStart(2,"0")} ${ap}`}
$(function(){
  const i=parseInt(new URLSearchParams(location.search).get("i")||"0",10);
  let all=[];try{all=JSON.parse(sessionStorage.getItem("groway_booking_list")||"[]")}catch(e){}
  const r=all[i];if(!r){location.href="bookings.html";return;}
  $("#back").attr("href","booking-detail.html?i="+i);
  $("#cur").text(r.date+", "+r.time);
  const mins=r.durationMins||60;
  const days=["Sat, Oct 3","Sun, Oct 4","Mon, Oct 5","Tue, Oct 6","Wed, Oct 7","Thu, Oct 8","Fri, Oct 9"];
  let day=days[0],slot=null;
  function drawDays(){$("#days").empty();days.forEach(d=>$("#days").append(`<button class="chip ${d===day?'active':''}" data-d="${d}">${d}</button>`));}
  function drawSlots(){$("#slots").empty();for(let t=10*60;t+mins<=19*60+30;t+=30){
    const label=fmtT(t)+" – "+fmtT(t+mins);
    $("#slots").append(`<div class="col-4 col-md-3"><div class="slot ${slot===label?'sel':''}" data-t="${label}">${label}</div></div>`);}}
  $("#days").on("click",".chip",function(){day=$(this).data("d");slot=null;drawDays();drawSlots();$("#save").prop("disabled",true);});
  $("#slots").on("click",".slot",function(){slot=$(this).data("t");drawSlots();$("#save").prop("disabled",false);});
  $("#save").on("click",()=>{r.date=day;r.time=slot;sessionStorage.setItem("groway_booking_list",JSON.stringify(all));
    location.href="booking-detail.html?i="+i;});
  drawDays();drawSlots();
});
</script>
</body>
</html>
