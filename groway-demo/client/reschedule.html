<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reschedule — Groway</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-teal-dark">
  <div class="container">
    <a class="navbar-brand font-display fs-4" href="../index.html">Groway</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="map.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link active" href="bookings.html">My bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="../login-client.html">Sign in</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4" style="max-width:760px">
  <h1 class="font-display mb-1">Reschedule</h1>
  <p class="text-muted mb-4" id="sub"></p>
  <div class="d-flex gap-2 flex-wrap mb-4" id="dates"></div>
  <div class="row g-2" id="slots"></div>
  <div class="d-flex justify-content-between mt-4">
    <a href="#" id="back" class="btn btn-link">← Back to booking</a>
    <button class="btn btn-primary px-5" id="confirm" disabled>Confirm new time</button>
  </div>
</div>
<script src="../assets/vendor/jquery.min.js"></script>
<script src="../assets/vendor/bootstrap.bundle.min.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script>
const ref=new URLSearchParams(location.search).get("ref")||"GW-8X2K4N";
const b=DEMO.myBookings.find(x=>x.ref===ref)||DEMO.myBookings[0];
const DAYS=["Fri, Oct 2","Sat, Oct 3","Sun, Oct 4","Mon, Oct 5","Tue, Oct 6","Wed, Oct 7","Thu, Oct 8"];
const TIMES=[];for(let h=10;h<=19;h++){TIMES.push(h+":00",h+":30");}TIMES.pop();
function fmt(t){let[h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${m===0?"00":"30"} ${ap}`;}
let selDate=DAYS[1],selTime=null;
function renderSlots(){const el=$("#slots");el.empty();selTime=null;$("#confirm").prop("disabled",true);
  TIMES.forEach((t,i)=>{const off=(i*3+selDate.length)%7===1;
    el.append(`<div class="col-4 col-md-3"><div class="slot${off?' off':''}" data-t="${fmt(t)}">${fmt(t)}</div></div>`);});}
$(function(){
  $("#sub").text(`${b.service} · currently ${b.date}, ${b.time}`);
  $("#back").attr("href","booking-detail.html?ref="+b.ref);
  DAYS.forEach((d,i)=>$("#dates").append(`<button class="chip${i===1?' active':''}" data-d="${d}">${d}</button>`));
  $("#dates").on("click",".chip",function(){$("#dates .chip").removeClass("active");$(this).addClass("active");selDate=$(this).data("d");renderSlots();});
  $("#slots").on("click",".slot:not(.off)",function(){$("#slots .slot").removeClass("sel");$(this).addClass("sel");selTime=$(this).data("t");$("#confirm").prop("disabled",false);});
  $("#confirm").on("click",()=>{location.href="booking-detail.html?ref="+b.ref+"&rescheduled=1";});
  renderSlots();
});
</script>
</body>
</html>
