<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose your therapist — Groway</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-teal-dark">
  <div class="container">
    <a class="navbar-brand font-display fs-4" href="../index.html">Groway</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="map.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link" href="bookings.html">My bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="../login-client.html">Sign in</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4" style="max-width:760px">
  <div class="d-flex align-items-center gap-2 mb-1 flex-wrap" id="steps"></div>
  <h2 class="font-display mb-1">Choose your therapist</h2>
  <p class="text-muted mb-4">One therapist performs your whole basket — only therapists qualified for <em>every</em> selected service are shown.</p>
  <div class="alert alert-warning d-none" id="noone">No single therapist at this store can perform this combination. <a href="book-1-service.html">Adjust your basket</a>.</div>
  <div class="list-group" id="staff"></div>
  <div class="d-flex justify-content-between mt-4">
    <a href="book-1-service.html" class="btn btn-outline-secondary">Back</a>
    <button class="btn btn-primary" id="next" disabled>Continue</button>
  </div>
</div>
<script src="../assets/vendor/jquery.min.js"></script>
<script src="../assets/vendor/bootstrap.bundle.min.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script>
const BK={get(){try{return JSON.parse(sessionStorage.getItem('groway_booking')||'{}')}catch(e){return{}}},set(p){const b=Object.assign(this.get(),p);sessionStorage.setItem('groway_booking',JSON.stringify(b));return b}};
function renderSteps(n){const L=["Services","Therapist","Time","Details","Confirm"];$("#steps").html(L.map((l,i)=>`${i?'<span class="text-muted">—</span>':''}<span class="d-flex align-items-center gap-1"><span class="step-dot ${i<n?'done':i===n?'now':''}">${i<n?'✓':i+1}</span><span class="small ${i===n?'fw-bold':''}">${l}</span></span>`).join(""))}
$(function(){
  renderSteps(1);
  const b=BK.get();
  if(!b.serviceIds||!b.serviceIds.length){location.href="book-1-service.html";return;}
  const svcs=b.serviceIds.map(id=>DEMO.services.find(x=>x.id===id));
  // one technician = intersection of staff qualified for EVERY service, active at this store
  const cand=DEMO.staff.filter(p=>p.active[b.storeId]&&svcs.every(sv=>sv.staff.includes(p.id)));
  let sel=b.staffId&&cand.some(p=>p.id===b.staffId)?b.staffId:"any";
  function draw(){
    $("#staff").empty();
    const any=`<button class="list-group-item list-group-item-action d-flex align-items-center gap-3 stf ${sel==="any"?'active':''}" data-id="any">
      <span class="step-dot ${sel==="any"?'done':''}">✦</span>
      <span><span class="fw-semibold">No preference</span><br><span class="small text-muted">First available qualified therapist</span></span></button>`;
    $("#staff").append(any);
    cand.forEach(p=>{$("#staff").append(`<button class="list-group-item list-group-item-action d-flex align-items-center gap-3 stf ${sel===p.id?'active':''}" data-id="${p.id}">
      <img src="../${p.avatar}" class="rounded-circle" style="width:52px;height:52px;object-fit:cover" alt="${p.name}">
      <span><span class="fw-semibold">${p.name}</span><br><span class="small text-muted">${p.title} · ${p.languages.join(", ")}</span></span></button>`);});
    $("#next").prop("disabled",false);
    if(!cand.length){$("#noone").removeClass("d-none");$("#next").prop("disabled",true);}
  }
  $("#staff").on("click",".stf",function(){sel=$(this).data("id");draw();});
  $("#next").on("click",()=>{BK.set({staffId:sel==="any"?null:sel});location.href="book-3-time.html";});
  draw();
});
</script>
</body>
</html>
