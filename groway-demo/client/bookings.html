<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My bookings — Groway</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-teal-dark">
  <div class="container">
    <a class="navbar-brand font-display fs-4" href="../index.html">Groway</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="map.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link active" href="bookings.html">My bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="../login-client.html">Sign in</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4" style="max-width:760px">
  <h2 class="font-display mb-4">My bookings</h2>
  <div class="d-grid gap-3" id="list"></div>
  <div class="text-center mt-4"><a href="map.html" class="btn btn-outline-primary">Book something new</a></div>
</div>
<script src="../assets/vendor/jquery.min.js"></script>
<script src="../assets/vendor/bootstrap.bundle.min.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script>
$(function(){
  let mine=[];try{mine=JSON.parse(sessionStorage.getItem("groway_my_bookings")||"[]")}catch(e){}
  const seed=[{ref:"GW-8X2K4N",storeId:"store-bayview",storeName:"Selah Head Spa — Bayview",
    serviceIds:["svc-aroma"],staffId:"anna",date:"Fri, Oct 9",time:"2:00 PM – 3:00 PM",durationMins:60,price:89,
    contactName:"Demo Guest",contactPhone:"(416) 555-0100",consentSms:false,consentEmail:false,src:null,status:"confirmed"}];
  const all=[...mine,...seed];
  all.forEach((r,i)=>{$("#list").append(`<a href="booking-detail.html?i=${i}" class="text-decoration-none text-dark"><div class="card card-hover"><div class="card-body d-flex justify-content-between align-items-center">
    <div><div class="fw-semibold">${r.serviceIds.map(id=>(DEMO.services.find(x=>x.id===id)||{}).name).filter(Boolean).join(" + ")}</div>
    <div class="small text-muted">${r.storeName} · ${r.date}, ${r.time}</div>
    <div class="small text-muted">Ref <span class="fw-semibold">${r.ref}</span></div></div>
    <span class="badge ${r.status==="confirmed"?"bg-teal-dark":"bg-secondary"}">${r.status}</span>
  </div></div></a>`);});
  sessionStorage.setItem("groway_booking_list",JSON.stringify(all));
});
</script>
</body>
</html>
