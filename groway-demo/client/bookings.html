<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My bookings — Groway</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-teal-dark">
  <div class="container">
    <a class="navbar-brand font-display fs-4" href="../index.html">Groway</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="map.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link active" href="bookings.html">My bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="../login-client.html">Sign in</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4" style="max-width:760px">
  <h1 class="font-display mb-4">My bookings</h1>
  <h5 class="font-display text-muted">Upcoming</h5>
  <div id="upcoming" class="d-flex flex-column gap-3 mb-4"></div>
  <h5 class="font-display text-muted">Past</h5>
  <div id="past" class="d-flex flex-column gap-3"></div>
</div>
<script src="../assets/vendor/jquery.min.js"></script>
<script src="../assets/vendor/bootstrap.bundle.min.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script>
function card(b){
  const badge=b.status==="Completed"?"secondary":"success";
  return `<a href="booking-detail.html?ref=${b.ref}" class="card card-hover text-decoration-none text-dark"><div class="card-body d-flex justify-content-between align-items-center">
    <div><div class="fw-semibold">${b.service}</div>
    <div class="small text-muted">${b.store} · with ${b.staff}</div>
    <div class="small text-muted">${b.date} · ${b.time}</div></div>
    <div class="text-end"><span class="badge bg-${badge}">${b.status}</span><div class="small text-muted mt-1">${b.ref}</div></div>
  </div></a>`;
}
$(function(){
  const up=DEMO.myBookings.filter(b=>b.status!=="Completed"),pa=DEMO.myBookings.filter(b=>b.status==="Completed");
  $("#upcoming").html(up.map(card).join("")||`<div class="alert alert-light">No upcoming bookings.</div>`);
  $("#past").html(pa.map(card).join(""));
});
</script>
</body>
</html>
