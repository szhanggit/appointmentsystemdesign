<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking detail — Groway</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-teal-dark">
  <div class="container">
    <a class="navbar-brand font-display fs-4" href="../index.html">Groway</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="map.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link active" href="bookings.html">My bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="../login-client.html">Sign in</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4" style="max-width:640px">
  <a href="bookings.html" class="small text-muted">&larr; My bookings</a>
  <h2 class="font-display mt-2 mb-1">Booking <span id="ref" style="letter-spacing:.1em"></span></h2>
  <p><span class="badge bg-teal-dark" id="status"></span></p>
  <div class="card mb-3"><div class="card-body">
    <div class="detail-label mb-2">Services · in sequence</div><div id="basket"></div><hr>
    <div class="d-flex justify-content-between py-1"><span class="text-muted">Therapist</span><strong id="dStaff"></strong></div>
    <div class="d-flex justify-content-between py-1"><span class="text-muted">When</span><strong id="dWhen"></strong></div>
    <div class="d-flex justify-content-between py-1"><span class="text-muted">Where</span><strong id="dWhere"></strong></div>
    <div class="d-flex justify-content-between py-1 d-none" id="srcrow"><span class="text-muted">Booking via</span><strong id="dSrc"></strong></div>
  </div></div>
  <div class="card mb-4"><div class="card-body">
    <div class="detail-label mb-2">Notifications</div>
    <p class="small text-muted mb-0">Confirmation sent by SMS + email. A reminder goes out 24h before your visit.</p>
  </div></div>
  <div class="d-flex gap-2">
    <a href="#" id="resched" class="btn btn-outline-primary">Reschedule</a>
    <button class="btn btn-outline-danger" id="cancel">Cancel booking</button>
  </div>
</div>
<script src="../assets/vendor/jquery.min.js"></script>
<script src="../assets/vendor/bootstrap.bundle.min.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script>
$(function(){
  const i=parseInt(new URLSearchParams(location.search).get("i")||"0",10);
  let all=[];try{all=JSON.parse(sessionStorage.getItem("groway_booking_list")||"[]")}catch(e){}
  const r=all[i];if(!r){location.href="bookings.html";return;}
  $("#ref").text(r.ref);$("#status").text(r.status);
  const list=(r.serviceIds||[]).map(id=>DEMO.services.find(x=>x.id===id)).filter(Boolean).sort((a,b)=>a.seq-b.seq);
  list.forEach((sv,n)=>$("#basket").append(`<div class="d-flex justify-content-between py-1">
    <span><span class="badge bg-gold me-2">${n+1}</span>${sv.name}</span><strong>$${sv.price}</strong></div>`));
  const p=r.staffId?DEMO.staff.find(x=>x.id===r.staffId):null;
  $("#dStaff").text(p?p.name:"No preference");
  $("#dWhen").text(r.date+", "+r.time);$("#dWhere").text(r.storeName);
  if(r.src){$("#srcrow").removeClass("d-none");$("#dSrc").text(DEMO.srcLabels[r.src]||r.src);}
  $("#resched").attr("href","reschedule.html?i="+i);
  $("#cancel").on("click",()=>{if(confirm("Cancel this booking? Free cancellation up to 4 hours before.")){r.status="cancelled";
    sessionStorage.setItem("groway_booking_list",JSON.stringify(all));location.reload();}});
});
</script>
</body>
</html>
