<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discover — Groway</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-teal-dark">
  <div class="container">
    <a class="navbar-brand font-display fs-4" href="../index.html">Groway</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="map.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link" href="bookings.html">My bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="../login-client.html">Sign in</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4">
  <h2 class="font-display mb-1">Discover near Richmond Hill</h2>
  <p class="text-muted mb-4">Real-time availability · book as a guest, no account needed</p>
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card"><div class="card-body p-2">
        <svg viewBox="0 0 400 300" class="w-100" style="height:340px;background:#eef2ec;border-radius:.4rem" role="img" aria-label="Map">
          <g stroke="#dce5da" stroke-width="1">
            <line x1="0" y1="75" x2="400" y2="75"/><line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="225" x2="400" y2="225"/>
            <line x1="100" y1="0" x2="100" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/><line x1="300" y1="0" x2="300" y2="300"/>
          </g>
          <text x="12" y="20" font-size="12" fill="#8a8172">Richmond Hill</text>
          <text x="288" y="290" font-size="12" fill="#8a8172">Toronto · Yorkville</text>
          <a href="store.html?store=store-bayview" class="map-pin">
            <circle class="halo" cx="120" cy="110" r="26"/><circle cx="120" cy="110" r="9" fill="#14655a"/>
            <text x="120" y="145" font-size="12" text-anchor="middle" fill="#2e2a24" font-weight="600">Bayview</text>
          </a>
          <a href="store.html?store=store-yorkville" class="map-pin">
            <circle class="halo" cx="310" cy="220" r="26"/><circle cx="310" cy="220" r="9" fill="#b98a2f"/>
            <text x="310" y="255" font-size="12" text-anchor="middle" fill="#2e2a24" font-weight="600">Yorkville</text>
          </a>
        </svg>
      </div></div>
    </div>
    <div class="col-lg-5">
      <div class="d-grid gap-3" id="cards"></div>
      <a href="chain.html" class="btn btn-outline-primary w-100 mt-3">View the Selah chain page</a>
    </div>
  </div>
</div>
<script src="../assets/vendor/jquery.min.js"></script>
<script src="../assets/vendor/bootstrap.bundle.min.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script>
$(function(){
  DEMO.stores.forEach(s=>{
    $("#cards").append(`<div class="card card-hover"><div class="card-body">
      <h5 class="font-display mb-1">${s.name}</h5>
      <p class="small text-muted mb-1">${s.address}</p>
      <p class="small text-muted mb-3">${s.hours} · ${s.phone}</p>
      <div class="d-flex gap-2">
        <a href="store.html?store=${s.id}" class="btn btn-outline-primary btn-sm">Details</a>
        <a href="book-1-service.html?store=${s.id}" class="btn btn-primary btn-sm">Book now</a>
      </div></div></div>`);
  });
});
</script>
</body>
</html>
