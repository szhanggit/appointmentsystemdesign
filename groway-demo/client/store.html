<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store — Groway</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-teal-dark">
  <div class="container">
    <a class="navbar-brand font-display fs-4" href="../index.html">Groway</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="map.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link" href="bookings.html">My bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="../login-client.html">Sign in</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4" style="max-width:860px">
  <a href="chain.html" class="small text-muted">&larr; Selah Head Spa chain</a>
  <div class="row g-4 mt-1 mb-4">
    <div class="col-md-5"><img id="sphoto" class="img-fluid rounded" alt="Store"></div>
    <div class="col-md-7">
      <h2 class="font-display mb-1" id="sname"></h2>
      <p class="text-muted small mb-1" id="saddr"></p>
      <p class="text-muted small mb-1" id="sphone"></p>
      <p class="text-muted small mb-3" id="shours"></p>
      <p id="sabout"></p>
      <a href="#" id="booknow" class="btn btn-primary">Book now</a>
    </div>
  </div>

  <h4 class="font-display mb-3">Services</h4>
  <div id="cats"></div>

  <h4 class="font-display mt-5 mb-3">Our team</h4>
  <div class="row g-3" id="team"></div>

  <h4 class="font-display mt-5 mb-3">Store policies</h4>
  <div class="card bg-light"><div class="card-body">
    <p class="mb-0 small" id="policies"></p>
  </div></div>
</div>
<footer class="bg-teal-dark text-white py-4 mt-5">
  <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
    <span class="font-display">Groway</span><span class="small opacity-75">Investor demo — fictional data.</span>
  </div>
</footer>
<script src="../assets/vendor/jquery.min.js"></script>
<script src="../assets/vendor/bootstrap.bundle.min.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script>
$(function(){
  const q = new URLSearchParams(location.search);
  const storeId = q.get("store") || "store-bayview";
  const s = DEMO.stores.find(x=>x.id===storeId) || DEMO.stores[0];
  $("#sname").text(s.name); $("#saddr").text(s.address);
  $("#sphone").text(s.phone); $("#shours").text(s.hours); $("#sabout").text(s.about);
  $("#sphoto").attr("src", "../"+s.photos[0]);
  $("#booknow").attr("href", "book-1-service.html?store="+s.id);
  $("#policies").text(DEMO.policies.en);
  // Services grouped by category, in sequence_order (menu display order = combo execution order)
  const cats=[...new Set(DEMO.services.map(x=>x.cat))];
  cats.forEach(c=>{
    $("#cats").append(`<h6 class="mt-4 text-uppercase detail-label">${c}</h6><div class="list-group mb-2" id="g-${c.replace(/\W+/g,'')}"></div>`);
    DEMO.services.filter(x=>x.cat===c).sort((a,b)=>a.seq-b.seq).forEach(sv=>{
      $(`#g-${c.replace(/\W+/g,'')}`).append(`<div class="list-group-item d-flex justify-content-between align-items-center">
        <span><span class="fw-semibold">${sv.name}</span><br><span class="small text-muted">${sv.mins} mins</span></span>
        <span class="d-flex align-items-center gap-3"><span class="fw-bold">$${sv.price}</span>
        <a class="btn btn-sm btn-outline-primary" href="book-1-service.html?store=${s.id}&service_id=${sv.id}">Book</a></span></div>`);
    });
  });
  // Team strip — only staff ACTIVE at this store (inactive assignment = treated as nonexistent)
  DEMO.staff.filter(p=>p.active[s.id]).forEach(p=>{
    $("#team").append(`<div class="col-6 col-md-3"><a href="staff-profile.html?store=${s.id}&staff=${p.id}" class="text-decoration-none text-dark">
      <div class="card card-hover text-center h-100"><div class="card-body">
        <img src="../${p.avatar}" class="avatar-lg mb-2" alt="${p.name}">
        <div class="fw-semibold">${p.name}</div>
        <div class="small text-muted">${p.title}</div>
      </div></div></a></div>`);
  });
});
</script>
</body>
</html>
