<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review booking — Groway</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-teal-dark">
  <div class="container">
    <a class="navbar-brand font-display fs-4" href="../index.html">Groway</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="map.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link" href="bookings.html">My bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="../login-client.html">Sign in</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4" style="max-width:640px">
  <div class="d-flex align-items-center gap-2 mb-1 flex-wrap" id="steps"></div>
  <h2 class="font-display mb-4">Review your booking</h2>
  <div class="card mb-3"><div class="card-body">
    <div class="detail-label mb-2">Services · in sequence</div>
    <div id="basket"></div>
    <hr>
    <div class="d-flex justify-content-between"><span class="text-muted">Total time</span><strong id="rtime"></strong></div>
    <div class="d-flex justify-content-between"><span class="text-muted">Total price</span><strong id="rprice"></strong></div>
  </div></div>
  <div class="card mb-3"><div class="card-body">
    <div class="d-flex justify-content-between py-1"><span class="text-muted">Therapist</span><strong id="rstaff"></strong></div>
    <div class="d-flex justify-content-between py-1"><span class="text-muted">When</span><strong id="rwhen"></strong></div>
    <div class="d-flex justify-content-between py-1"><span class="text-muted">Where</span><strong id="rwhere"></strong></div>
    <div class="d-flex justify-content-between py-1"><span class="text-muted">Booked by</span><strong id="rwho"></strong></div>
  </div></div>
  <div class="card mb-3"><div class="card-body">
    <div class="detail-label mb-2">Marketing consent</div>
    <div class="d-flex justify-content-between py-1"><span class="text-muted">SMS offers</span><strong id="rsms"></strong></div>
    <div class="d-flex justify-content-between py-1"><span class="text-muted">Email offers</span><strong id="remail"></strong></div>
    <div class="d-flex justify-content-between py-1 d-none" id="srcrow"><span class="text-muted">Booking via</span><strong id="rsrc"></strong></div>
  </div></div>
  <div class="d-flex justify-content-between">
    <a href="book-4-contact.html" class="btn btn-outline-secondary">Back</a>
    <button class="btn btn-gold btn-lg" id="confirm">Confirm booking</button>
  </div>
</div>
<script src="../assets/vendor/jquery.min.js"></script>
<script src="../assets/vendor/bootstrap.bundle.min.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script>
const BK={get(){try{return JSON.parse(sessionStorage.getItem('groway_booking')||'{}')}catch(e){return{}}},set(p){const b=Object.assign(this.get(),p);sessionStorage.setItem('groway_booking',JSON.stringify(b));return b}};
function renderSteps(n){const L=["Services","Therapist","Time","Details","Confirm"];$("#steps").html(L.map((l,i)=>`${i?'<span class="text-muted">—</span>':''}<span class="d-flex align-items-center gap-1"><span class="step-dot ${i<n?'done':i===n?'now':''}">${i<n?'✓':i+1}</span><span class="small ${i===n?'fw-bold':''}">${l}</span></span>`).join(""))}
function fmtDur(m){const h=Math.floor(m/60),r=m%60;return (h?h+"h ":"")+(r?r+"m":"").trim()||"0m"}
function genRef(){const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<8;i++)s+=A[Math.floor(Math.random()*A.length)];return s.slice(0,4)+"-"+s.slice(4)}
$(function(){
  renderSteps(4);
  const b=BK.get();
  if(!b.contactName){location.href="book-4-contact.html";return;}
  const s=DEMO.stores.find(x=>x.id===b.storeId)||DEMO.stores[0];
  const list=b.serviceIds.map(id=>DEMO.services.find(x=>x.id===id)).sort((a,b2)=>a.seq-b2.seq);
  list.forEach((sv,i)=>$("#basket").append(`<div class="d-flex justify-content-between py-1">
    <span><span class="badge bg-gold me-2">${i+1}</span>${sv.name} <span class="text-muted small">· ${sv.mins} min</span></span><strong>$${sv.price}</strong></div>`));
  const mins=list.reduce((t,x)=>t+x.mins,0), price=list.reduce((t,x)=>t+x.price,0);
  $("#rtime").text(fmtDur(mins)+" single block");$("#rprice").text("$"+price);
  const p=b.staffId?DEMO.staff.find(x=>x.id===b.staffId):null;
  $("#rstaff").text(p?p.name:"No preference");
  $("#rwhen").text(b.date+", "+b.time);$("#rwhere").text(s.name);$("#rwho").text(b.contactName+" · "+b.contactPhone);
  $("#rsms").text(b.consentSms?"Yes":"No");$("#remail").text(b.consentEmail?"Yes":"No");
  if(b.src){$("#srcrow").removeClass("d-none");$("#rsrc").text(DEMO.srcLabels[b.src]||b.src);}
  $("#confirm").on("click",()=>{
    const ref=genRef();
    const rec={ref,storeId:s.id,storeName:s.name,serviceIds:b.serviceIds,staffId:b.staffId||null,
      date:b.date,time:b.time,durationMins:mins,price,contactName:b.contactName,contactPhone:b.contactPhone,
      consentSms:!!b.consentSms,consentEmail:!!b.consentEmail,src:b.src||null,status:"confirmed"};
    try{const all=JSON.parse(sessionStorage.getItem("groway_my_bookings")||"[]");all.unshift(rec);
      sessionStorage.setItem("groway_my_bookings",JSON.stringify(all));}catch(e){}
    BK.set({ref});
    location.href="book-6-success.html";
  });
});
</script>
</body>
</html>
