<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review &amp; confirm — Groway</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-teal-dark">
  <div class="container">
    <a class="navbar-brand font-display fs-4" href="../index.html">Groway</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="map.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link" href="bookings.html">My bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="../login-client.html">Sign in</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4" style="max-width:560px">
  <div class="d-flex align-items-center gap-2 mb-1 flex-wrap" id="steps"></div>
  <h2 class="font-display mb-4">Review &amp; confirm</h2>
  <div class="card mb-3"><div class="card-body">
    <div class="detail-label mb-2">Selah Head Spa · 8120 Bayview Ave, Richmond Hill</div>
    <div class="d-flex justify-content-between py-1"><span class="text-muted">Service</span><strong id="rSvc"></strong></div>
    <div class="d-flex justify-content-between py-1"><span class="text-muted">Therapist</span><strong id="rStaff"></strong></div>
    <div class="d-flex justify-content-between py-1"><span class="text-muted">When</span><strong id="rWhen"></strong></div>
    <div class="d-flex justify-content-between py-1"><span class="text-muted">Booked for</span><strong id="rName"></strong></div>
    <div class="d-flex justify-content-between py-1"><span class="text-muted">Phone</span><strong id="rPhone"></strong></div>
    <hr><div class="d-flex justify-content-between"><span class="text-muted">Total due at store</span><strong class="fs-5" id="rPrice"></strong></div>
  </div></div>
  <p class="small text-muted mb-4">Free cancellation up to 4 hours before your appointment. Running late? Call <a href="tel:+19055550134">(905) 555-0134</a>.</p>
  <div class="d-flex justify-content-between">
    <a href="book-4-contact.html" class="btn btn-link">← Back</a>
    <button class="btn btn-primary btn-lg px-5" id="confirm">Confirm booking</button>
  </div>
</div>
<script src="../assets/vendor/jquery.min.js"></script>
<script src="../assets/vendor/bootstrap.bundle.min.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script>
const BK={get(){try{return JSON.parse(sessionStorage.getItem('groway_booking')||'{}')}catch(e){return{}}},set(p){const b=Object.assign(this.get(),p);sessionStorage.setItem('groway_booking',JSON.stringify(b));return b}};
function renderSteps(n){const L=["Service","Staff","Time","Details","Confirm"];$("#steps").html(L.map((l,i)=>`${i?'<span class="text-muted">—</span>':''}<span class="d-flex align-items-center gap-1"><span class="step-dot ${i<n?'done':i===n?'now':''}">${i<n?'✓':i+1}</span><span class="small ${i===n?'fw-bold':''}">${l}</span></span>`).join(""))}
$(function(){
  const b=BK.get();
  if(!b.contactName)location.href="book-4-contact.html";
  renderSteps(4);
  $("#rSvc").text(`${b.serviceName} (${b.mins} mins)`);
  $("#rStaff").text(b.staffName||"First available");
  $("#rWhen").text(`${b.date}, ${b.time}`);
  $("#rName").text(b.contactName);$("#rPhone").text(b.contactPhone);
  $("#rPrice").text("$"+b.price+".00");
  $("#confirm").on("click",()=>{
    const ref="GW-"+Array.from({length:6},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
    BK.set({ref:ref,done:true});
    location.href="book-6-success.html?ref="+ref;
  });
});
</script>
</body>
</html>
