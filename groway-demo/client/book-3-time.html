<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a time — Groway</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-teal-dark">
  <div class="container">
    <a class="navbar-brand font-display fs-4" href="../index.html">Groway</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="map.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link" href="bookings.html">My bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="../login-client.html">Sign in</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4" style="max-width:760px">
  <div class="d-flex align-items-center gap-2 mb-1 flex-wrap" id="steps"></div>
  <h2 class="font-display mb-1">Choose a time</h2>
  <p class="text-muted mb-4">Your basket runs as <strong id="block"></strong> — one continuous block.</p>
  <h6 class="text-uppercase detail-label">Day</h6>
  <div class="d-flex gap-2 flex-wrap mb-4" id="days"></div>
  <h6 class="text-uppercase detail-label">Available start times</h6>
  <div class="row g-2" id="slots"></div>
  <div class="d-flex justify-content-between mt-4">
    <a href="book-2-staff.html" class="btn btn-outline-secondary">Back</a>
    <button class="btn btn-primary" id="next" disabled>Continue</button>
  </div>
</div>
<script src="../assets/vendor/jquery.min.js"></script>
<script src="../assets/vendor/bootstrap.bundle.min.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script>
const BK={get(){try{return JSON.parse(sessionStorage.getItem('groway_booking')||'{}')}catch(e){return{}}},set(p){const b=Object.assign(this.get(),p);sessionStorage.setItem('groway_booking',JSON.stringify(b));return b}};
function renderSteps(n){const L=["Services","Therapist","Time","Details","Confirm"];$("#steps").html(L.map((l,i)=>`${i?'<span class="text-muted">—</span>':''}<span class="d-flex align-items-center gap-1"><span class="step-dot ${i<n?'done':i===n?'now':''}">${i<n?'✓':i+1}</span><span class="small ${i===n?'fw-bold':''}">${l}</span></span>`).join(""))}
function fmtDur(m){const h=Math.floor(m/60),r=m%60;return (h?h+"h ":"")+(r?r+"m":"").trim()||"0m"}
function fmtT(mins){let h=Math.floor(mins/60),m=mins%60;const ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${String(m).padStart(2,"0")} ${ap}`}
$(function(){
  renderSteps(2);
  const b=BK.get();
  if(!b.serviceIds||!b.serviceIds.length){location.href="book-1-service.html";return;}
  const mins=b.serviceIds.map(id=>DEMO.services.find(x=>x.id===id).mins).reduce((t,x)=>t+x,0);
  $("#block").text(fmtDur(mins)+" block");
  const days=["Sat, Oct 3","Sun, Oct 4","Mon, Oct 5","Tue, Oct 6","Wed, Oct 7","Thu, Oct 8","Fri, Oct 9"];
  let day=b.date||days[0], slot=b.time||null;
  function drawDays(){$("#days").empty();days.forEach(d=>$("#days").append(
    `<button class="chip ${d===day?'active':''}" data-d="${d}">${d}</button>`));}
  function drawSlots(){
    $("#slots").empty();
    for(let t=10*60;t+mins<=19*60+30;t+=30){
      const label=fmtT(t)+" – "+fmtT(t+mins);
      const off=(t===13*60); // a couple of "booked" slots for realism
      $("#slots").append(`<div class="col-4 col-md-3"><div class="slot ${slot===label?'sel':''} ${off?'off':''}" data-t="${label}">${label}</div></div>`);
    }
  }
  $("#days").on("click",".chip",function(){day=$(this).data("d");slot=null;drawDays();drawSlots();$("#next").prop("disabled",true);});
  $("#slots").on("click",".slot:not(.off)",function(){slot=$(this).data("t");drawSlots();$("#next").prop("disabled",false);});
  $("#next").on("click",()=>{BK.set({date:day,time:slot,durationMins:mins});location.href="book-4-contact.html";});
  drawDays();drawSlots();
  if(slot)$("#next").prop("disabled",false);
});
</script>
</body>
</html>
