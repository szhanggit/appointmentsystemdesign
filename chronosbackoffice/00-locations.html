<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a location - byChronos</title>
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<!-- Source: locations.png -->
<header class="d-flex justify-content-between align-items-center px-4 py-3 border-bottom bg-white">
  <a href="00-login.html" class="auth-brand text-decoration-none text-dark">
    <span class="brand-mark d-inline-flex align-items-center justify-content-center"><i class="bi bi-emoji-smile"></i></span>
    byChronos
  </a>
  <span class="sidebar-avatar">SZ</span>
</header>

<main class="container py-5" style="max-width:900px;">
  <p class="text-muted fw-semibold mb-4">CHOOSE A LOCATION TO ENTER</p>

  <div class="mb-3">
    <label class="form-label text-muted small">Search locations by name</label>
    <div class="input-group">
      <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
      <input type="text" class="form-control" placeholder="Search locations by name">
      <span class="input-group-text bg-white"><i class="bi bi-x-lg"></i></span>
    </div>
  </div>
  <div class="mb-4">
    <label class="form-label text-muted small">Filter by IDs (e.g. 1,2,3)</label>
    <div class="input-group">
      <span class="input-group-text bg-white">123</span>
      <input type="text" class="form-control" placeholder="Filter by IDs (e.g. 1,2,3)">
      <span class="input-group-text bg-white"><i class="bi bi-x-lg"></i></span>
    </div>
  </div>

  <p class="text-muted mb-3"><i class="bi bi-bar-chart"></i> Showing 1&ndash;1 / 1</p>

  <div class="ad-card d-flex justify-content-between align-items-center">
    <div>
      <div class="fs-4 fw-bold">Selah Head Spa</div>
      <div class="text-muted">280 West Beaver Creek Rd Lower Floor Unit 11-12 Richmond Hill, ON L4B 3B1Canada</div>
    </div>
    <a href="0-home.html" class="btn btn-ad px-4">SELECT</a>
  </div>
</main>
<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/site.js"></script>
</body>
</html>
