<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Category - byChronos</title>
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body style="background:#1c2b3399;">
<!-- Source: EditServiceCategory.png -->
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="ad-card bg-white" style="width:480px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 fw-bold mb-0">Edit Category</h1>
      <a href="inv-01-services.html" class="text-dark"><i class="bi bi-x-lg fs-5"></i></a>
    </div>
    <div class="border rounded d-flex align-items-center justify-content-center mb-2" style="height:220px; background:#fafafa;">
      <i class="bi bi-image text-muted" style="font-size:3rem;"></i>
    </div>
    <button class="btn btn-ad-outline border w-100 mb-3"><i class="bi bi-upload"></i> SELECT PHOTO</button>
    <div class="mb-3">
      <label class="form-label text-muted small">Color</label>
      <div class="input-group"><span class="input-group-text bg-white"><span class="d-inline-block rounded-circle" style="width:20px;height:20px;background:#83C6AE;"></span></span><input type="text" class="form-control" value="#83C6AE"></div>
    </div>
    <div class="mb-3"><label class="form-label text-muted small">Name *</label><input type="text" class="form-control" value="Body Care"></div>
    <div class="mb-3"><label class="form-label text-muted small">Sort Order</label><input type="text" class="form-control" value="2"></div>
    <div class="mb-4"><label class="form-label text-muted small">Description</label><textarea class="form-control" rows="3"></textarea></div>
    <div class="d-flex justify-content-between">
      <button class="btn btn-outline-danger"><i class="bi bi-trash"></i> DELETE</button>
      <div class="d-flex gap-2">
        <a href="inv-01-services.html" class="btn btn-ad-outline border">CANCEL</a>
        <button class="btn btn-ad">SUBMIT</button>
      </div>
    </div>
  </div>
</div>
<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/site.js"></script>
</body>
</html>
