<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Time off - byChronos</title>
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<!-- Source: TimeOffDetail.png -->
<div class="p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 fw-bold mb-0">New Time off</h1>
    <a href="appt-01-calendar.html" class="text-dark"><i class="bi bi-x-lg fs-5"></i></a>
  </div>

  <div class="row g-4">
    <div class="col-lg-6">
      <div class="mb-3">
        <label class="form-label">Block Name</label>
        <input type="text" class="form-control" value="Unavailable">
      </div>
      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="form-label">Effective Date From</label>
          <input type="text" class="form-control" value="09/18/2026">
        </div>
        <div class="col-6">
          <label class="form-label">Effective Date To</label>
          <input type="text" class="form-control" value="09/18/2026">
        </div>
      </div>
      <div class="row g-3">
        <div class="col-6">
          <label class="form-label">From</label>
          <div class="input-group"><input type="text" class="form-control" value="10:45 AM"><span class="input-group-text bg-white"><i class="bi bi-clock"></i></span></div>
        </div>
        <div class="col-6">
          <label class="form-label">To</label>
          <div class="input-group"><input type="text" class="form-control" value="11:59 PM"><span class="input-group-text bg-white"><i class="bi bi-clock"></i></span></div>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="d-flex flex-column gap-2">
        <label class="d-flex justify-content-between align-items-center border-start border-3 ps-3 py-1" style="border-color:#8a97a3 !important;"><span>All Staffer</span><input type="checkbox" class="form-check-input"></label>
        <label class="d-flex justify-content-between align-items-center border-start border-3 ps-3 py-1" style="border-color:#8a97a3 !important;"><span>ANNA</span><input type="checkbox" class="form-check-input"></label>
        <label class="d-flex justify-content-between align-items-center border-start border-3 ps-3 py-1" style="border-color:#8a97a3 !important;"><span>Any Professional</span><input type="checkbox" class="form-check-input"></label>
        <label class="d-flex justify-content-between align-items-center border-start border-3 ps-3 py-1" style="border-color:#8a97a3 !important;"><span>ASHER OMT</span><input type="checkbox" class="form-check-input"></label>
        <label class="d-flex justify-content-between align-items-center border-start border-3 ps-3 py-1" style="border-color:#8a97a3 !important;"><span>CONNIE</span><input type="checkbox" class="form-check-input"></label>
        <label class="d-flex justify-content-between align-items-center border-start border-3 ps-3 py-1" style="border-color:#8a97a3 !important;"><span>Emily</span><input type="checkbox" class="form-check-input"></label>
        <label class="d-flex justify-content-between align-items-center border-start border-3 ps-3 py-1" style="border-color:#8a97a3 !important;"><span>EVA</span><input type="checkbox" class="form-check-input"></label>
        <label class="d-flex justify-content-between align-items-center border-start border-3 ps-3 py-1" style="border-color:#8a97a3 !important;"><span>Lisa</span><input type="checkbox" class="form-check-input"></label>
        <label class="d-flex justify-content-between align-items-center border-start border-3 ps-3 py-1" style="border-color:#8a97a3 !important;"><span>Amy</span><input type="checkbox" class="form-check-input"></label>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-end mt-4 border-top pt-3">
    <button class="btn" style="background:var(--ad-teal-light); color:var(--ad-teal);">FINISH</button>
  </div>
</div>
<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/site.js"></script>
</body>
</html>
