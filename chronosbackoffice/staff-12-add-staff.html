<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Staff Member - byChronos</title>
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body style="background:#1c2b3399;">
<!-- Source: AddNewStaff.png -->
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="ad-card bg-white" style="width:560px; max-height:90vh; overflow-y:auto;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 fw-bold mb-0">Add Staff Member</h1>
      <a href="staff-01-overview.html" class="text-dark"><i class="bi bi-x-lg fs-5"></i></a>
    </div>
    <div class="form-check mb-3"><input type="checkbox" class="form-check-input" checked><label class="form-check-label">Assign All Services</label></div>
    <div class="mb-3"><input type="text" class="form-control" placeholder="First Name *"></div>
    <div class="mb-3"><input type="text" class="form-control" placeholder="Last Name"></div>
    <div class="mb-3"><label class="form-label text-muted small">Phone Number</label><input type="text" class="form-control" value="+1"></div>
    <div class="mb-3"><input type="email" class="form-control" placeholder="Email"></div>
    <div class="mb-3"><textarea class="form-control" rows="3" placeholder="Description"></textarea></div>
    <div class="row g-3 mb-4">
      <div class="col-6"><label class="form-label text-muted small">Sort Order</label><input type="text" class="form-control" value="0"></div>
      <div class="col-6"><input type="text" class="form-control" placeholder="Passcode"></div>
    </div>
    <div class="ad-card mb-4">
      <h2 class="h6 fw-bold mb-1">Permission Level</h2>
      <p class="text-muted small">If you want the staffer to login with a passcode, you must enter either email or phone number.</p>
      <div class="d-flex justify-content-between align-items-center border rounded p-2">Staffer <i class="bi bi-arrow-right"></i></div>
    </div>
    <div class="d-flex justify-content-end gap-2">
      <a href="staff-01-overview.html" class="btn btn-ad-outline border">CANCEL</a>
      <button class="btn btn-ad">SUBMIT</button>
    </div>
  </div>
</div>
<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/site.js"></script>
</body>
</html>
