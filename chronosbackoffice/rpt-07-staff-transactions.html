<!-- Source: staffella.png (drill-in for ELLA) -->
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="ad-card bg-white" style="width:960px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4 fw-bold mb-0">Staff Transactions</h1>
      <a href="rpt-06-staffpayments.html" class="text-dark"><i class="bi bi-x-lg fs-5"></i></a>
    </div>
    <div class="row g-3 mb-4">
      <div class="col-md-4"><label class="form-label text-muted small">Range</label><select class="form-select"><option>This Week</option></select></div>
      <div class="col-md-4"><label class="form-label text-muted small">From</label><input type="text" class="form-control" value="2026-09-20"></div>
      <div class="col-md-4"><label class="form-label text-muted small">To</label><input type="text" class="form-control" value="2026-09-26"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">

    </table>
    <div class="ad-card d-flex justify-content-between align-items-center mt-3">
      <strong style="color: var(--ad-teal);">ELLA</strong>
      <span>$0.00</span><span>0</span><span>$0.00</span><span>$0.00</span><span>$0.00</span>
