      <div><button class="btn btn-ad">SUBMIT</button></div>

      <div class="modal-body">
        <div class="mb-3"><input type="text" class="form-control" placeholder="Name *"></div>
        <div class="mb-3"><textarea class="form-control" rows="2" placeholder="Description"></textarea></div>
        <div class="row g-3">
          <div class="col-md-4"><input type="text" class="form-control" placeholder="Price"></div>
          <div class="col-md-4"><input type="text" class="form-control" placeholder="Duration"></div>
          <div class="col-md-4"><input type="text" class="form-control" placeholder="Sort Order"></div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-ad" data-bs-dismiss="modal">SUBMIT</button></div>
    </div>
