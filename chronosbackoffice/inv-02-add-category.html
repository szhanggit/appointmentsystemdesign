<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Category - byChronos</title>
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body style="background:#1c2b3399;">
<!-- Source: AddCategory.png (Services tab). Identical modal also reached
     from Service Bundles' Categories "+ NEW" (NewServiceBundlesCategory.png) -
     built once and reused. Products has a simpler variant with no
     Color/Sort Order field - see inv-11-products.html. -->
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="ad-card bg-white" style="width:560px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4 fw-bold mb-0">Add Category</h1>
      <a href="inv-01-services.html" class="text-dark"><i class="bi bi-x-lg fs-5"></i></a>
    </div>
    <div class="mb-3">
      <label class="form-label text-muted small">Color</label>
      <div class="input-group"><span class="input-group-text bg-white"><span class="d-inline-block rounded-circle" style="width:20px;height:20px;background:#4D959C;"></span></span><input type="text" class="form-control" value="#4D959C"></div>
    </div>
    <div class="mb-3"><label class="form-label text-muted small">Name *</label><input type="text" class="form-control"></div>
    <div class="mb-3"><label class="form-label text-muted small">Sort Order</label><input type="text" class="form-control"></div>
    <div class="mb-4"><label class="form-label text-muted small">Description</label><textarea class="form-control" rows="3"></textarea></div>
    <div class="text-end"><button class="btn btn-ad">SUBMIT</button></div>
  </div>
</div>
<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/site.js"></script>
</body>
</html>
