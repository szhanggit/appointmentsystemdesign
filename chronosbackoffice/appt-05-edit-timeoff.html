<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Off - byChronos</title>
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<!-- Source: UnavailableSession.png (the gray calendar block - shown as a
     sample in appt-01-calendar.html's ANNA column), ClickUnavailableSession.png
     (this edit form, shown after clicking that block) -->
<div class="p-4" style="max-width:640px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 fw-bold mb-0">Time Off</h1>
    <a href="appt-01-calendar.html" class="text-dark"><i class="bi bi-x-lg fs-5"></i></a>
  </div>

  <div class="mb-3">
    <label class="form-label">Block Name</label>
    <input type="text" class="form-control" value="Unavailable">
  </div>
  <div class="row g-3 mb-3">
    <div class="col-6">
      <label class="form-label">Effective Date From</label>
      <input type="text" class="form-control" value="09/14/2026">
    </div>
    <div class="col-6">
      <label class="form-label">Effective Date To</label>
      <input type="text" class="form-control" value="09/14/2026">
    </div>
  </div>
  <div class="row g-3">
    <div class="col-6">
      <label class="form-label">From</label>
      <div class="input-group"><input type="text" class="form-control" value="11:00 AM"><span class="input-group-text bg-white"><i class="bi bi-clock"></i></span></div>
    </div>
    <div class="col-6">
      <label class="form-label">To</label>
      <div class="input-group"><input type="text" class="form-control" value="11:59 PM"><span class="input-group-text bg-white"><i class="bi bi-clock"></i></span></div>
    </div>
  </div>

  <div class="d-flex gap-2 mt-4 border-top pt-3">
    <button class="btn btn-danger" style="background:#f2777b; border-color:#f2777b;"><i class="bi bi-trash"></i></button>
    <a href="appt-01-calendar.html" class="btn btn-ad-outline border">CANCEL</a>
    <button class="btn btn-ad">SUBMIT</button>
  </div>
</div>
<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/site.js"></script>
</body>
</html>
