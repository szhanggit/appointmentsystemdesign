<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a new coupon - byChronos</title>
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<!-- Source: newcoupon.png -->
<div class="p-4">
  <div class="ad-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4 fw-bold mb-0">Create a new coupon</h1>
      <a href="mkt-02-coupons.html" class="btn" style="background:#6c7a86; color:#fff;"><i class="bi bi-arrow-left"></i> BACK</a>
    </div>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="border rounded d-flex align-items-center justify-content-center mb-2" style="height:220px; background:#fafafa;">
          <i class="bi bi-image text-muted" style="font-size:3rem;"></i>
        </div>
        <button class="btn btn-ad-outline border w-100"><i class="bi bi-upload"></i> SELECT PHOTO</button>
      </div>
      <div class="col-md-8">
        <div class="row g-3 mb-3">
          <div class="col-md-6"><input type="text" class="form-control" placeholder="Coupon Code *"></div>
          <div class="col-md-6"><input type="text" class="form-control" placeholder="Coupon Name *"></div>
        </div>
        <div class="mb-2 text-muted small">Percentage/Amount</div>
        <div class="row g-3 mb-3 align-items-center">
          <div class="col-md-6 d-flex gap-4">
            <div class="form-check"><input type="radio" class="form-check-input" name="pa" checked><label class="form-check-label">Percentage</label></div>
            <div class="form-check"><input type="radio" class="form-check-input" name="pa"><label class="form-check-label">Amount</label></div>
          </div>
          <div class="col-md-6"><input type="text" class="form-control" placeholder="Percentage *"></div>
        </div>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label text-muted small">Valid from</label><input type="text" class="form-control" value="2026-09-19"></div>
          <div class="col-md-6"><label class="form-label text-muted small">Valid until</label><input type="text" class="form-control" value="2027-03-19"></div>
        </div>
      </div>
    </div>
    <div class="text-end mt-4"><button class="btn btn-ad">SUBMIT</button></div>
  </div>
</div>
<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/site.js"></script>
</body>
</html>
